name: Build

on:
  push:
    branches: [main, echo-cancellation]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Install build tools
        run: |
          brew install meson ninja pkgconf || true
          meson --version
          pkg-config --version

      - name: Cache WebRTC build
        uses: actions/cache@v4
        with:
          path: vendor/webrtc
          key: webrtc-${{ runner.os }}-${{ hashFiles('scripts/build-webrtc.sh') }}

      - name: Build app
        run: |
          VERSION="0.1.${{ github.run_number }}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          chmod +x scripts/*.sh
          scripts/build-app.sh "$VERSION" "${{ github.run_number }}"

      - name: Audio test (simulated speakerphone call)
        run: |
          python3 -m pip install --quiet --break-system-packages numpy || python3 -m pip install --quiet numpy
          W="$PWD/vendor/webrtc"
          clang++ -std=c++17 -O2 -arch arm64 -mmacosx-version-min=14.4 \
            -I Sources/CEchoCancel/include -I "$W/include/webrtc-audio-processing-2" -I "$W/include" \
            -DWEBRTC_LIBRARY_IMPL -DWEBRTC_POSIX \
            tests/aec_test.cpp Sources/CEchoCancel/EchoCancel.cpp \
            -L "$W/lib" -lwebrtc-audio-processing-2 -framework CoreFoundation -framework Foundation \
            -o aec_test
          python3 tests/aec_test.py ./aec_test "$RUNNER_TEMP/aec"

      - name: Updater safety test
        run: |
          APP_BIN="dist/ClearCall.app/Contents/MacOS/ClearCall"
          # 1. A genuine build must be accepted.
          OUT=$("$APP_BIN" --verify-update "dist/ClearCall-$VERSION.zip" "${{ github.run_number }}"); echo "$OUT"
          echo "$OUT" | grep -q "ACCEPTED" || { echo "genuine update was rejected"; exit 1; }
          # 2. A tampered app (changed after signing) must be rejected.
          T="$RUNNER_TEMP/tampered"; rm -rf "$T"; mkdir -p "$T"
          ditto -x -k "dist/ClearCall-$VERSION.zip" "$T"
          printf 'x' >> "$T/ClearCall.app/Contents/MacOS/ClearCall"
          ditto -c -k --keepParent "$T/ClearCall.app" "$T/bad.zip"
          OUT=$("$APP_BIN" --verify-update "$T/bad.zip" "${{ github.run_number }}"); echo "$OUT"
          echo "$OUT" | grep -q "REJECTED" || { echo "tampered update was accepted"; exit 1; }
          # 3. A different app must be rejected.
          T="$RUNNER_TEMP/other"; rm -rf "$T"; mkdir -p "$T"
          ditto -x -k "dist/ClearCall-$VERSION.zip" "$T"
          /usr/libexec/PlistBuddy -c 'Set :CFBundleIdentifier com.example.other' "$T/ClearCall.app/Contents/Info.plist"
          codesign --force --sign - "$T/ClearCall.app"
          ditto -c -k --keepParent "$T/ClearCall.app" "$T/other.zip"
          OUT=$("$APP_BIN" --verify-update "$T/other.zip" "${{ github.run_number }}"); echo "$OUT"
          echo "$OUT" | grep -q "REJECTED" || { echo "different app was accepted"; exit 1; }
          # 4. A wrong version number must be rejected.
          OUT=$("$APP_BIN" --verify-update "dist/ClearCall-$VERSION.zip" 99999); echo "$OUT"
          echo "$OUT" | grep -q "REJECTED" || { echo "wrong-version update was accepted"; exit 1; }

      - name: Render window previews
        run: |
          "dist/ClearCall.app/Contents/MacOS/ClearCall" --render-previews "$RUNNER_TEMP/previews"

      - name: Keep previews (test branches)
        if: github.ref != 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view design-previews >/dev/null 2>&1 || \
            gh release create design-previews --prerelease --title "Design previews (internal)" --notes "Window renders from test builds." --target "${{ github.sha }}"
          gh release upload design-previews "$RUNNER_TEMP"/previews/*.png --clobber

      - name: Keep build (test branches)
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: ClearCall-${{ env.VERSION }}
          path: dist/ClearCall-${{ env.VERSION }}.zip

      - name: Publish download
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v$VERSION" "dist/ClearCall-$VERSION.zip" \
            --title "ClearCall $VERSION" \
            --notes "Download the zip, unzip it and move ClearCall to Applications. Commit: ${{ github.sha }}" \
            --target "${{ github.sha }}"
